<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>兴隆沟村 · 货物流转控制台</title>
    <link rel="stylesheet" href="./styles.css?v=20261019o" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>兴隆沟村 · 货物流转控制台</h1>
        <p class="sub">
          以一件货物为主线 · AI 沿路生成业务数据 · 人只在审核节点拍板
        </p>
      </div>
      <div class="top-actions">
        <span id="ai-status" class="badge">AI: 检查中</span>
        <button id="reset" class="ghost">重置演示数据</button>
      </div>
    </header>

    <section id="summary" class="summary" aria-label="货物阶段统计"></section>

    <main class="goods-layout">
      <aside class="goods-side">
        <div class="side-head">
          <div>
            <h2>货物清单</h2>
            <p class="sub">点一件货物，看它走到哪、下一步做什么</p>
          </div>
          <button id="toggle-submit" class="secondary small">新增货物</button>
        </div>
        <form id="produce-form" class="form submit-form" hidden>
          <label>村组<input name="groupName" value="3组" /></label>
          <label>蔬菜<input name="vegetableName" value="大白菜" /></label>
          <label>数量（公斤）<input name="quantityKg" type="number" value="120" min="1" /></label>
          <label>采收日期<input name="harvestDate" type="date" value="2026-10-19" /></label>
          <button type="submit">提交并由 AI 生成审核建议</button>
          <p class="form-note">提交后系统自动生成货物档案；审核通过后自动生成入库单与上架批次。</p>
        </form>
        <div id="goods-list" class="goods-list"></div>
      </aside>

      <section id="goods-detail" class="goods-detail"></section>
    </main>

    <section class="ops">
      <div class="ops-panel">
        <div class="ops-head">
          <h2>审计与预警</h2>
          <div class="ops-tools">
            <select id="scan-offset" class="scan-offset" aria-label="扫描时间">
              <option value="0">当前时间</option>
              <option value="60">1 小时后</option>
              <option value="1440">24 小时后</option>
              <option value="4320">72 小时后</option>
            </select>
            <button id="scan-alerts" class="secondary small">扫描预警</button>
          </div>
        </div>
        <div id="auditor-alerts" class="list"></div>
        <details id="alert-rule-book" class="rule-book">
          <summary id="alert-rule-summary">预警规则</summary>
          <div id="alert-rule-list" class="rule-list"></div>
        </details>
      </div>
      <div class="ops-panel">
        <div class="ops-head">
          <h2>运行状态</h2>
          <button id="drain-queue" class="ghost small">消费队列</button>
        </div>
        <div id="admin-stats" class="stats"></div>
        <div id="admin-infra" class="infra">存储与队列检查中</div>
        <h3>队列事件</h3>
        <div id="admin-queue" class="list compact"></div>
      </div>
    </section>

    <section class="feed">
      <div class="feed-head">
        <h2>全局事件流</h2>
        <span id="feed-mode" class="sub">业务动作、AI 建议、审计留痕都会出现在这里</span>
      </div>
      <ol id="event-feed"></ol>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./config.js?v=20261019o"></script>
    <script src="./app.js?v=20261019o" type="module"></script>
  </body>
</html>
